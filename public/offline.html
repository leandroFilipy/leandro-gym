<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão · Leandro Gym</title>
    <meta name="theme-color" content="#0c0c0b" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0c0b;
        --surface: #161614;
        --line: #302f2b;
        --fg: #f3f0e8;
        --muted: #aaa598;
        --accent: #ff5b14;
        --accent-fg: #150600;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        border-top: 6px solid var(--accent);
      }
      main {
        max-width: 22rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        background: var(--accent);
        transform: skewX(-12deg);
        margin-bottom: 20px;
        font-size: 28px;
      }
      h1 {
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
        font-size: 2rem;
        font-style: italic;
        font-weight: 800;
        text-transform: uppercase;
        line-height: 1;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 700;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 12px 20px;
        border-radius: 3px;
      }
      button:active {
        transform: translateY(1px);
      }
      .hint {
        margin-top: 20px;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">🏋️</div>
      <h1>Você está offline</h1>
      <p>
        Sem conexão agora. As séries que você registrar durante o treino ficam salvas no
        aparelho e sobem sozinhas quando a internet voltar.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
      <div class="hint" id="status">Aguardando conexão…</div>
    </main>
    <script>
      // Recarrega automaticamente assim que a conexão voltar.
      window.addEventListener("online", function () {
        document.getElementById("status").textContent = "Conexão restaurada. Recarregando…";
        location.reload();
      });
    </script>
  </body>
</html>
